# Conduce-Fácil · configuración de Cloudflare Pages
#
# El sitio publicable es la carpeta ./public. Las funciones de ./functions se
# despliegan automáticamente como Pages Functions.
#
# El aplicativo está en modo servidor: las cuentas y los resultados viven en la
# base D1 enlazada abajo, de manera que cada persona entra a la URL con su
# usuario y su contraseña desde cualquier dispositivo, y la cuenta de
# administración ve el avance de todas.
#
# Si el enlace no estuviera disponible, el aplicativo sigue funcionando en modo
# local (todo en el navegador) sin necesidad de cambiar nada.

name = "conduce-facil"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "conduce-facil"
database_id = "ca5e81cb-4e63-4ce0-9bdc-d1a19711c5f1"
