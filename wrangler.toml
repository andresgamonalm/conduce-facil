# Conduce-Fácil · configuración de Cloudflare Pages
#
# El sitio publicable es la carpeta ./public. Las funciones de ./functions se
# despliegan automáticamente como Pages Functions.
#
# Las cuentas se definen en public/assets/js/almacenamiento_conduce_facil.js y
# viven en el navegador de cada persona. Cada quien entra a la URL con su
# usuario y su contraseña desde cualquier dispositivo, y ve sus propios
# resultados. No hay base de datos de por medio.

name = "conduce-facil"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

# Base de datos desactivada por decisión de la propiedad del proyecto: las
# cuentas viven en los archivos del repositorio, como en el resto de los
# aplicativos. Basta con descomentar estas líneas para volver al modo servidor,
# que es lo único que permitiría a la cuenta de administración ver los
# resultados de las demás personas desde su propio dispositivo.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "conduce-facil"
# database_id = "ca5e81cb-4e63-4ce0-9bdc-d1a19711c5f1"
