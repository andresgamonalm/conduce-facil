# Conduce-Fácil · configuración de Cloudflare Pages
#
# El sitio publicable es la carpeta ./public. Las funciones de ./functions se
# despliegan automáticamente como Pages Functions.
#
# Las cuentas se definen en public/assets/js/almacenamiento_conduce_facil.js y
# se siembran solas en la base enlazada abajo. Cada persona entra a la URL con
# su usuario y su contraseña desde cualquier dispositivo, y su avance la sigue;
# la cuenta de administración ve además el de las demás.

name = "conduce-facil"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "conduce-facil"
database_id = "ca5e81cb-4e63-4ce0-9bdc-d1a19711c5f1"
